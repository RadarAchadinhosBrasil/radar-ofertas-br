name: Instagram — ofertas automáticas

on:
  schedule:
    - cron: "17 11 * * *"
    - cron: "17 13 * * *"
    - cron: "17 15 * * *"
    - cron: "17 17 * * *"
    - cron: "17 19 * * *"
    - cron: "17 21 * * *"
    - cron: "17 23 * * *"
    - cron: "17 1 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Lote UTC"
        required: true
        type: choice
        default: "0 12 * * *"
        options:
          - "17 11 * * *"
          - "17 13 * * *"
          - "17 15 * * *"
          - "17 17 * * *"
          - "17 19 * * *"
          - "17 21 * * *"
          - "17 23 * * *"
          - "17 1 * * *"
      acao:
        description: "Modo manual: testar sem publicar ou publicar no Feed"
        required: true
        type: choice
        default: "preview"
        options:
          - "preview"
          - "publicar"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests pillow

      - name: Definir horário do lote
        id: slot
        env:
          MANUAL_SLOT: ${{ inputs.slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="$MANUAL_SLOT"
          else
            SLOT="$EVENT_SCHEDULE"
          fi

          case "$SLOT" in
            "17 11 * * *"|"17 13 * * *"|"17 15 * * *"|"17 17 * * *"|"17 19 * * *"|"17 21 * * *"|"17 23 * * *"|"17 1 * * *") ;;
            *) echo "Horário não reconhecido: $SLOT"; exit 1 ;;
          esac

          echo "value=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Testar legenda e hashtags sem publicar
        if: github.event_name == 'workflow_dispatch' && inputs.acao == 'preview'
        env:
          IG_ACTION: preview
          SLOT_UTC: ${{ steps.slot.outputs.value }}
        run: python publicar_instagram.py

      - name: Converter imagem do produto para JPG
        if: github.event_name != 'workflow_dispatch' || inputs.acao == 'publicar'
        env:
          SLOT_UTC: ${{ steps.slot.outputs.value }}
        run: python preparar_imagens_instagram.py

      - name: Montar site preservando o painel e catálogo
        if: github.event_name != 'workflow_dispatch' || inputs.acao == 'publicar'
        run: |
          python - <<'PY'
          import csv, hashlib, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          out = Path("_site")
          images = out / "images"
          images.mkdir(parents=True, exist_ok=True)

          out.joinpath("index.html").write_text(
              Path("painel/index.html").read_text(encoding="utf-8"),
              encoding="utf-8"
          )
          readme = Path("painel/README.md")
          if readme.exists():
              out.joinpath("README.md").write_text(
                  readme.read_text(encoding="utf-8"), encoding="utf-8"
              )

          with open("produtos.csv", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              rows = list(reader)

          for row in rows:
              url = (row.get("imagem_url") or "").strip()
              if not url.startswith("https://"):
                  continue
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0 RadarOfertasBR/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=25) as response:
                      data = response.read()
                      mime = response.headers.get_content_type()
                  if not mime.startswith("image/") or not data:
                      continue
                  ext = {
                      "image/jpeg": ".jpg",
                      "image/png": ".png",
                      "image/webp": ".webp",
                      "image/avif": ".avif"
                  }.get(mime, Path(urlparse(url).path).suffix or ".img")
                  name = hashlib.sha256(url.encode()).hexdigest()[:20] + ext
                  (images / name).write_bytes(data)
                  row["imagem_url"] = "images/" + name
              except Exception as error:
                  print("Imagem do painel mantida na origem:", error)

          with open(out / "produtos.csv", "w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          story_assets = Path("_site/instagram-assets")
          story_assets.mkdir(parents=True, exist_ok=True)
          jpgs = list(Path("_site/instagram-assets").glob("*.jpg"))
          if not jpgs:
              raise SystemExit("Imagem JPG do Instagram não foi gerada.")
          print("Painel e catálogo preservados em _site.")
          PY

      - name: Configurar GitHub Pages
        if: github.event_name != 'workflow_dispatch' || inputs.acao == 'publicar'
        uses: actions/configure-pages@v5

      - name: Enviar site e imagem JPG para Pages
        if: github.event_name != 'workflow_dispatch' || inputs.acao == 'publicar'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar site no GitHub Pages
        if: github.event_name != 'workflow_dispatch' || inputs.acao == 'publicar'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validar imagem pública
        if: github.event_name != 'workflow_dispatch' || inputs.acao == 'publicar'
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, requests
          from pathlib import Path

          base = os.environ["PAGES_URL"].rstrip("/")
          mapping = json.loads(
              Path("instagram_images.json").read_text(encoding="utf-8")
          )
          relative = next(iter(mapping.values()))
          url = base + "/" + relative.lstrip("/")

          response = requests.get(url, timeout=45)
          response.raise_for_status()
          if "image/jpeg" not in response.headers.get("Content-Type", "").lower():
              raise SystemExit("A imagem pública não está em formato JPG.")
          if len(response.content) < 10000:
              raise SystemExit("A imagem pública parece incompleta.")

          print("Imagem JPG pública validada:", url)
          print("Tamanho:", len(response.content), "bytes")
          PY

      - name: Diagnosticar token e permissões da Meta (sem exibir o token)
        if: github.event_name == 'schedule' || inputs.acao == 'publicar'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_API_VERSION: ${{ vars.IG_GRAPH_API_VERSION || secrets.IG_GRAPH_API_VERSION }}
        run: |
          python - <<'PY'
          import os, requests

          token = os.environ.get("IG_ACCESS_TOKEN", "")
          ig_id = os.environ.get("IG_USER_ID", "")
          version = os.environ.get("IG_GRAPH_API_VERSION", "")
          if not all((token, ig_id, version)):
              print("DIAGNOSTICO: falta token, ID do Instagram ou versão da API.")
              raise SystemExit(0)

          base = f"https://graph.facebook.com/{version}"
          for label, url, params in [
              ("PERMISSOES", f"{base}/me/permissions", {"access_token": token}),
              ("CONTA_INSTAGRAM", f"{base}/{ig_id}", {
                  "fields": "id,username", "access_token": token
              }),
          ]:
              try:
                  response = requests.get(url, params=params, timeout=30)
                  try:
                      data = response.json()
                  except Exception:
                      data = {"body": response.text[:500]}
                  if response.ok:
                      if label == "PERMISSOES":
                          entries = data.get("data", [])
                          print("PERMISSOES_CONCEDIDAS:", [
                              item.get("permission") for item in entries
                              if item.get("status") == "granted"
                          ])
                          print("PERMISSOES_NAO_CONCEDIDAS:", [
                              {"permission": item.get("permission"),
                               "status": item.get("status")}
                              for item in entries if item.get("status") != "granted"
                          ])
                      else:
                          print("CONTA_INSTAGRAM_VALIDADA:", data)
                  else:
                      error = data.get("error", {})
                      print(f"{label}_ERRO: HTTP {response.status_code}; "
                            f"tipo={error.get('type')}; código={error.get('code')}; "
                            f"mensagem={error.get('message')}")
              except Exception as exc:
                  print(f"{label}_FALHA_DE_REDE: {type(exc).__name__}: {exc}")
          PY

      - name: Publicar uma oferta no Instagram
        if: github.event_name == 'schedule' || inputs.acao == 'publicar'
        env:
          IG_ACTION: publish
          SLOT_UTC: ${{ steps.slot.outputs.value }}
          IG_MEDIA_TYPE: IMAGE
          CONFIRMAR_PUBLICACAO: ${{ secrets.CONFIRMAR_PUBLICACAO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_API_VERSION: ${{ vars.IG_GRAPH_API_VERSION || secrets.IG_GRAPH_API_VERSION }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python publicar_instagram.py

      - name: Salvar avanço do rodízio sem repetir produtos
        if: github.event_name == 'schedule' || inputs.acao == 'publicar'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram_feed_state.json
          if git diff --cached --quiet; then
            echo "Nenhum avanço do rodízio para salvar."
          else
            git commit -m "Atualiza rodízio do Feed do Instagram"
            git push
          fi
