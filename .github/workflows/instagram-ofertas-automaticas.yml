name: Instagram — ofertas automáticas

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      slot:
        description: "Lote UTC"
        required: true
        type: choice
        default: "0 12 * * *"
        options:
          - "0 12 * * *"
          - "0 15 * * *"
          - "0 18 * * *"
          - "0 21 * * *"
      acao:
        description: "Modo manual: testar sem publicar ou publicar no Feed"
        required: true
        type: choice
        default: "preview"
        options:
          - "preview"
          - "publicar"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: instagram-ofertas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install requests pillow

      - name: Definir horário do lote
        id: slot
        env:
          MANUAL_SLOT: ${{ inputs.slot }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SLOT="$MANUAL_SLOT"
          else
            SLOT="$EVENT_SCHEDULE"
          fi

          case "$SLOT" in
            "0 12 * * *"|"0 15 * * *"|"0 18 * * *"|"0 21 * * *") ;;
            *) echo "Horário não reconhecido: $SLOT"; exit 1 ;;
          esac

          echo "value=$SLOT" >> "$GITHUB_OUTPUT"

      - name: Converter imagem do produto para JPG
        env:
          SLOT_UTC: ${{ steps.slot.outputs.value }}
        run: python preparar_imagens_instagram.py

      - name: Montar site preservando o painel e catálogo
        run: |
          python - <<'PY'
          import csv, hashlib, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          out = Path("_site")
          images = out / "images"
          images.mkdir(parents=True, exist_ok=True)

          out.joinpath("index.html").write_text(
              Path("painel/index.html").read_text(encoding="utf-8"),
              encoding="utf-8"
          )
          readme = Path("painel/README.md")
          if readme.exists():
              out.joinpath("README.md").write_text(
                  readme.read_text(encoding="utf-8"), encoding="utf-8"
              )

          with open("produtos.csv", encoding="utf-8-sig", newline="") as f:
              reader = csv.DictReader(f)
              fields = reader.fieldnames
              rows = list(reader)

          for row in rows:
              url = (row.get("imagem_url") or "").strip()
              if not url.startswith("https://"):
                  continue
              try:
                  req = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0 RadarOfertasBR/1.0"}
                  )
                  with urllib.request.urlopen(req, timeout=25) as response:
                      data = response.read()
                      mime = response.headers.get_content_type()
                  if not mime.startswith("image/") or not data:
                      continue
                  ext = {
                      "image/jpeg": ".jpg",
                      "image/png": ".png",
                      "image/webp": ".webp",
                      "image/avif": ".avif"
                  }.get(mime, Path(urlparse(url).path).suffix or ".img")
                  name = hashlib.sha256(url.encode()).hexdigest()[:20] + ext
                  (images / name).write_bytes(data)
                  row["imagem_url"] = "images/" + name
              except Exception as error:
                  print("Imagem do painel mantida na origem:", error)

          with open(out / "produtos.csv", "w", encoding="utf-8", newline="") as f:
              writer = csv.DictWriter(f, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)

          story_assets = Path("_site/instagram-assets")
          story_assets.mkdir(parents=True, exist_ok=True)
          jpgs = list(Path("_site/instagram-assets").glob("*.jpg"))
          if not jpgs:
              raise SystemExit("Imagem JPG do Instagram não foi gerada.")
          print("Painel e catálogo preservados em _site.")
          PY

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar site e imagem JPG para Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar site no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Validar imagem pública
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json, os, requests
          from pathlib import Path

          base = os.environ["PAGES_URL"].rstrip("/")
          mapping = json.loads(
              Path("instagram_images.json").read_text(encoding="utf-8")
          )
          relative = next(iter(mapping.values()))
          url = base + "/" + relative.lstrip("/")

          response = requests.get(url, timeout=45)
          response.raise_for_status()
          if "image/jpeg" not in response.headers.get("Content-Type", "").lower():
              raise SystemExit("A imagem pública não está em formato JPG.")
          if len(response.content) < 10000:
              raise SystemExit("A imagem pública parece incompleta.")

          print("Imagem JPG pública validada:", url)
          print("Tamanho:", len(response.content), "bytes")
          PY

      - name: Publicar uma oferta no Instagram
        if: github.event_name == 'schedule' || inputs.acao == 'publicar'
        env:
          IG_ACTION: publish
          SLOT_UTC: ${{ steps.slot.outputs.value }}
          IG_MEDIA_TYPE: IMAGE
          CONFIRMAR_PUBLICACAO: ${{ secrets.CONFIRMAR_PUBLICACAO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_API_VERSION: ${{ vars.IG_GRAPH_API_VERSION || secrets.IG_GRAPH_API_VERSION }}
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: python publicar_instagram.py
