name: Publicar painel no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "painel/**"
      - "index.html"
      - "produtos.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar painel e hospedar imagens localmente
        run: |
          python - <<'PY'
          import csv, hashlib, os, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          out = Path("_site")
          images = out / "images"
          images.mkdir(parents=True, exist_ok=True)
          with open("index.html", encoding="utf-8") as src:
              (out / "index.html").write_text(src.read(), encoding="utf-8")
          readme = Path("painel/README.md")
          if readme.exists():
              (out / "README.md").write_text(readme.read_text(encoding="utf-8"), encoding="utf-8")

          with open("produtos.csv", encoding="utf-8-sig", newline="") as src:
              reader = csv.DictReader(src)
              fields = reader.fieldnames
              rows = list(reader)

          for row in rows:
              url = (row.get("imagem_url") or "").strip()
              if not url.startswith("https://"):
                  continue
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 RadarOfertasBR/1.0"})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      data = response.read()
                      mime = response.headers.get_content_type()
                  if not mime.startswith("image/") or not data:
                      raise ValueError("resposta não é imagem")
                  ext = {"image/jpeg": ".jpg", "image/png": ".png", "image/webp": ".webp", "image/avif": ".avif"}.get(mime, Path(urlparse(url).path).suffix or ".img")
                  name = hashlib.sha256(url.encode()).hexdigest()[:20] + ext
                  (images / name).write_bytes(data)
                  row["imagem_url"] = "images/" + name
                  print("IMAGEM HOSPEDADA:", name)
              except Exception as exc:
                  print("IMAGEM MANTIDA NA ORIGEM:", url, "-", exc)

          with open(out / "produtos.csv", "w", encoding="utf-8", newline="") as dst:
              writer = csv.DictWriter(dst, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          print("Catálogo preparado:", len(rows), "produtos;", len(list(images.iterdir())), "imagens locais.")
          PY
      - name: Gerar imagem de prévia para compartilhamento
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          width, height = 1200, 630
          image = Image.new("RGB", (width, height), (13, 13, 13))
          draw = ImageDraw.Draw(image)
          bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          regular = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          title = ImageFont.truetype(bold, 78)
          subtitle = ImageFont.truetype(bold, 48)
          small = ImageFont.truetype(regular, 30)
          yellow, white, gray = (255, 210, 31), (248, 248, 248), (185, 185, 185)

          draw.rounded_rectangle((42, 42, 1158, 588), radius=34, outline=yellow, width=5)
          draw.rounded_rectangle((84, 92, 210, 218), radius=28, fill=yellow)
          for radius in (48, 32, 16):
              draw.ellipse((147-radius, 155-radius, 147+radius, 155+radius), outline=(13, 13, 13), width=5)
          draw.line((147, 155, 184, 117), fill=(13, 13, 13), width=8)
          draw.ellipse((176, 109, 192, 125), fill=(13, 13, 13))
          draw.text((250, 105), "RADAR DE", font=subtitle, fill=white)
          draw.text((250, 165), "OFERTAS BR", font=title, fill=yellow)
          draw.line((90, 310, 1110, 310), fill=(70, 70, 70), width=3)
          draw.text((100, 365), "OFERTAS QUE VALEM", font=subtitle, fill=white)
          draw.text((100, 425), "A PENA.", font=subtitle, fill=yellow)
          draw.text((100, 525), "As melhores oportunidades em um só lugar.", font=small, fill=gray)
          Path("_site/social-preview.png").parent.mkdir(parents=True, exist_ok=True)
          image.save("_site/social-preview.png", format="PNG", optimize=True)
          print("Imagem social gerada:", Path("_site/social-preview.png").stat().st_size, "bytes")
          PY
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
