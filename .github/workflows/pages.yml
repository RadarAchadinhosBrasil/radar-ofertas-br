name: Publicar painel no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "painel/**"
      - "produtos.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar site
        run: |
          mkdir -p _site
          cp painel/index.html _site/index.html
          cp painel/README.md _site/README.md
          cp produtos.csv _site/produtos.csv
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
