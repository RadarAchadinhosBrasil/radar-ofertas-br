name: Publicar painel no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "painel/**"
      - "index.html"
      - "produtos.csv"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar painel e hospedar imagens localmente
        run: |
          python - <<'PY'
          import csv, hashlib, os, urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          out = Path("_site")
          images = out / "images"
          images.mkdir(parents=True, exist_ok=True)
          with open("index.html", encoding="utf-8") as src:
              (out / "index.html").write_text(src.read(), encoding="utf-8")
          readme = Path("painel/README.md")
          if readme.exists():
              (out / "README.md").write_text(readme.read_text(encoding="utf-8"), encoding="utf-8")

          with open("produtos.csv", encoding="utf-8-sig", newline="") as src:
              reader = csv.DictReader(src)
              fields = reader.fieldnames
              rows = list(reader)

          for row in rows:
              url = (row.get("imagem_url") or "").strip()
              if not url.startswith("https://"):
                  continue
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 RadarOfertasBR/1.0"})
                  with urllib.request.urlopen(request, timeout=25) as response:
                      data = response.read()
                      mime = response.headers.get_content_type()
                  if not mime.startswith("image/") or not data:
                      raise ValueError("resposta não é imagem")
                  ext = {"image/jpeg": ".jpg", "image/png": ".png", "image/webp": ".webp", "image/avif": ".avif"}.get(mime, Path(urlparse(url).path).suffix or ".img")
                  name = hashlib.sha256(url.encode()).hexdigest()[:20] + ext
                  (images / name).write_bytes(data)
                  row["imagem_url"] = "images/" + name
                  print("IMAGEM HOSPEDADA:", name)
              except Exception as exc:
                  print("IMAGEM MANTIDA NA ORIGEM:", url, "-", exc)

          with open(out / "produtos.csv", "w", encoding="utf-8", newline="") as dst:
              writer = csv.DictWriter(dst, fieldnames=fields)
              writer.writeheader()
              writer.writerows(rows)
          print("Catálogo preparado:", len(rows), "produtos;", len(list(images.iterdir())), "imagens locais.")
          PY
      - name: Gerar banner visual de compartilhamento com produtos da loja
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          from pathlib import Path
          import csv, math

          W, H = 1200, 630
          bg = Image.new("RGB", (W, H), (15, 16, 18))
          d = ImageDraw.Draw(bg)
          yellow = (255, 210, 31)
          white = (250, 250, 247)
          muted = (185, 188, 193)
          bold_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          reg_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          def font(size, bold=True):
              return ImageFont.truetype(bold_path if bold else reg_path, size)

          # Fundo com brilho e grafismos discretos, mantendo a identidade da loja.
          glow = Image.new("RGBA", (W, H), (0,0,0,0))
          gd = ImageDraw.Draw(glow)
          gd.ellipse((760,-250,1370,360), fill=(255,210,31,34))
          gd.ellipse((900,300,1450,850), fill=(255,210,31,18))
          glow = glow.filter(ImageFilter.GaussianBlur(65))
          bg = Image.alpha_composite(bg.convert("RGBA"), glow)
          d = ImageDraw.Draw(bg)

          # Cabeçalho / marca.
          d.rounded_rectangle((58,54,126,122), radius=18, fill=yellow)
          # Ícone de radar
          for r in (25,17,9):
              d.ellipse((92-r,88-r,92+r,88+r), outline=(20,20,20), width=3)
          d.line((92,88,112,68), fill=(20,20,20), width=5)
          d.ellipse((107,63,117,73), fill=(20,20,20))
          d.text((148,57), "RADAR DE OFERTAS BR", font=font(34), fill=white)
          d.text((150,101), "ACHADOS • DESCONTOS • OPORTUNIDADES", font=font(14), fill=yellow)

          # Mensagem principal com hierarquia visual.
          d.text((60,190), "BONS ACHADOS,", font=font(49), fill=white)
          d.text((60,250), "PREÇOS QUE", font=font(49), fill=white)
          d.text((60,310), "VALEM A PENA.", font=font(49), fill=yellow)
          d.rounded_rectangle((62,390,420,397), radius=4, fill=yellow)
          d.text((62,422), "Ofertas selecionadas do Mercado Livre", font=font(18,False), fill=muted)
          d.rounded_rectangle((60,492,360,548), radius=14, fill=yellow)
          d.text((84,507), "GARIMPE AGORA  →", font=font(19), fill=(17,17,17))

          # Fotos escolhidas pelos produtos que estão em divulgação no Meta e pelo Nike do catálogo.
          with open("_site/produtos.csv", encoding="utf-8-sig", newline="") as src:
              catalog = list(csv.DictReader(src))
          wanted_products = [
              "Power Bank 20.000mAh 22.5W Display Digital Davely",
              "Philips OneBlade Aparador e Barbeador Elétrico 5 em 1 QP1425/10",
              "Tênis Nike Revolution 8 Masculino",
          ]
          product_images = []
          for product_name in wanted_products:
              row = next((r for r in catalog if (r.get("produto") or "").strip() == product_name), None)
              if not row:
                  print("Produto não encontrado no catálogo:", product_name)
                  continue
              image_ref = (row.get("imagem_url") or "").strip()
              image_path = Path("_site") / image_ref
              if image_path.is_file():
                  product_images.append(image_path)
                  print("Foto selecionada:", product_name, image_path)
              else:
                  print("Foto local não encontrada:", product_name, image_ref)
          cards = [(590,92,850,365),(870,170,1128,443),(650,390,850,565)]
          for idx, (x1,y1,x2,y2) in enumerate(cards):
              d.rounded_rectangle((x1,y1,x2,y2), radius=22, fill=(250,250,248), outline=(255,255,255), width=2)
              if idx < len(product_images):
                  try:
                      product = Image.open(product_images[idx]).convert("RGB")
                      product.thumbnail((x2-x1-22,y2-y1-22))
                      px = x1 + ((x2-x1)-product.width)//2
                      py = y1 + ((y2-y1)-product.height)//2
                      bg.alpha_composite(product.convert("RGBA"), (px,py))
                  except Exception as exc:
                      print("Não foi possível usar foto", product_images[idx], exc)
          # Tarja promocional sobreposta sem cobrir os produtos.
          d.rounded_rectangle((875,82,1115,132), radius=13, fill=yellow)
          d.text((899,95), "OFERTAS DO DIA", font=font(17), fill=(18,18,18))
          # Contorno e rodapé.
          d.rounded_rectangle((24,24,W-24,H-24), radius=30, outline=(255,210,31,150), width=2)
          d.text((885,565), "RADAR DE OFERTAS BR", font=font(13), fill=muted)
          Path("_site/social-preview.png").parent.mkdir(parents=True, exist_ok=True)
          bg.convert("RGB").save("_site/social-preview.png", "PNG", optimize=True)
          print("Banner social gerado com", min(len(product_images), len(cards)), "fotos do catálogo.")
          PY
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
