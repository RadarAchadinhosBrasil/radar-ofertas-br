name: Instagram — prévia e publicação controlada
on:
  workflow_dispatch:
    inputs:
      acao:
        description: "Prévia não publica. Publicar envia de verdade para o Instagram."
        required: true
        type: choice
        default: "preview"
        options:
          - "preview"
          - "publish"
      slot:
        description: "Lote (horário UTC)"
        required: true
        type: choice
        default: "0 12 * * *"
        options:
          - "0 12 * * *"
          - "0 15 * * *"
          - "0 18 * * *"
          - "0 21 * * *"
      tipo:
        description: "Formato"
        required: true
        type: choice
        default: "IMAGE"
        options:
          - "IMAGE"
          - "STORIES"
      limite:
        description: "Quantidade máxima. Comece sempre com 1."
        required: true
        type: choice
        default: "1"
        options:
          - "1"
          - "lote"
permissions:
  contents: read
jobs:
  instagram:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Validar catálogo e gerar prévia ou publicar
        env:
          IG_ACTION: ${{ inputs.acao }}
          SLOT_UTC: ${{ inputs.slot }}
          IG_MEDIA_TYPE: ${{ inputs.tipo }}
          IG_MAX_PUBLICATIONS: ${{ inputs.limite }}
          CONFIRMAR_PUBLICACAO: ${{ secrets.CONFIRMAR_PUBLICACAO }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_API_VERSION: ${{ vars.IG_GRAPH_API_VERSION || secrets.IG_GRAPH_API_VERSION }}
        run: python publicar_instagram.py
