name: Instagram — validação segura
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Lote (horário UTC)"
        required: true
        type: choice
        options:
          - "0 12 * * *"
          - "0 15 * * *"
          - "0 18 * * *"
          - "0 21 * * *"
      tipo:
        description: "Formato para teste futuro"
        required: true
        type: choice
        options:
          - "IMAGE"
          - "STORIES"
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Validar configuração e mídia (sem publicar)
        env:
          SLOT_UTC: ${{ inputs.slot }}
          IG_MEDIA_TYPE: ${{ inputs.tipo }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_API_VERSION: ${{ vars.IG_GRAPH_API_VERSION || secrets.IG_GRAPH_API_VERSION }}
        run: python publicar_instagram.py
