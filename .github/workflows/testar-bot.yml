
name: Publicar ofertas automaticamente

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Publicar oferta
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@radardeofertasbr_oficial"
          SLOT_UTC: ${{ github.event.schedule }}
        run: python bot.py

  diagnostico_csv:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
     
      - name: Diagnosticar CSV sem publicar
        run: |
          echo "DIAGNOSTICO NOVO V3"
          python - <<'PY'
          import csv
          from pathlib import Path

          path = Path("produtos.csv")

          print("ARQUIVO EXISTE:", path.exists())
          print("CAMINHO:", path.resolve())

          with path.open("r", encoding="utf-8-sig", newline="") as f:
              linhas = [linha for linha in f if linha.strip()]

          print("TOTAL DE LINHAS NÃO VAZIAS:", len(linhas))
          print("PRIMEIRA LINHA BRUTA:", repr(linhas[0] if linhas else None))

          if not linhas:
              raise SystemExit("ERRO: produtos.csv está vazio.")

          leitor = csv.DictReader(linhas, delimiter=",")
          print("CABEÇALHOS:", repr(leitor.fieldnames))

          primeiro = next(leitor, None)
          print("PRIMEIRO PRODUTO:", repr(primeiro))

          if primeiro:
              print("produto =", primeiro.get("produto"))
              print("preco_atual_brl =", primeiro.get("preco_atual_brl"))
              print("link_afiliado =", primeiro.get("link_afiliado"))

          print("TOTAL DE PRODUTOS:", 1 + sum(1 for _ in leitor) if primeiro else 0)
          PY

