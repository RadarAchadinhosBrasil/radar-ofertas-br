name: Publicar ofertas automaticamente

on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "7 21 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Publicar oferta
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@radardeofertasbr_oficial"
          SLOT_UTC: ${{ github.event.schedule }}
        run: python bot.py

      - name: Informar execução manual
        if: github.event_name == 'workflow_dispatch'
run: 'echo "Execução manual: nenhuma oferta foi publicada."'
