
name: Publicar ofertas automaticamente

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 18 * * *"
    - cron: "0 21 * * *"

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Publicar oferta
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@radardeofertasbr_oficial"
          SLOT_UTC: ${{ github.event.schedule }}
        run: python bot.py

  diagnostico_csv:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
     
      - name: Diagnosticar CSV sem publicar
        run: |
          python - <<'PY'
          from bot import carregar_produtos

          produtos = carregar_produtos()
          if len(produtos) < 30:
              raise SystemExit(f"ERRO: esperados 30 produtos; encontrados {len(produtos)}.")

          for numero, produto in enumerate(produtos, start=2):
              faltando = []
              if not (produto.get("produto") or "").strip():
                  faltando.append("nome")
              if not (produto.get("preco_atual_brl") or "").strip():
                  faltando.append("preço atual")
              if not (produto.get("link_afiliado") or "").strip():
                  faltando.append("link de afiliado")
              if faltando:
                  raise SystemExit(f"Erro na linha {numero} do CSV: faltam {', '.join(faltando)}.")

          print(f"SUCESSO: {len(produtos)} produtos válidos. Nenhuma mensagem foi enviada ao Telegram.")
          PY
