name: Instagram - lembrete semanal de sexta

on:
  schedule:
    - cron: "0 13 * * 5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-weekly-reminder
  cancel-in-progress: false

jobs:
  publish-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate eight ready-to-use designs
        run: |
          pip install pillow
          python instagram-lembrete-sexta/gerar_artes.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add instagram-reminder-assets/
          if ! git diff --cached --quiet; then
            git commit -m "Prepara artes variadas do lembrete semanal"
            git push
          fi
      - name: Select this week's design
        run: |
          WEEK=$(TZ=America/Sao_Paulo date +%V)
          INDEX=$(( (10#$WEEK - 1) % 8 + 1 ))
          printf 'IG_REMINDER_IMAGE_URL=https://raw.githubusercontent.com/RadarAchadinhosBrasil/radar-ofertas-br/main/instagram-reminder-assets/lembrete-sexta-%02d.jpg\n' "$INDEX" >> "$GITHUB_ENV"
          echo "Arte selecionada: $INDEX de 8"
      - name: Install dependency
        run: pip install requests
      - name: Publish Friday reminder
        env:
          IG_GRAPH_API_VERSION: ${{ vars.IG_GRAPH_API_VERSION || secrets.IG_GRAPH_API_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python instagram-lembrete-sexta/publicar_lembrete.py
