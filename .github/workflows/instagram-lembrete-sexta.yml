name: Instagram - lembrete semanal de sexta

on:
  schedule:
    - cron: "0 13 * * 5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instagram-weekly-reminder
  cancel-in-progress: false

jobs:
  publish-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency
        run: pip install requests
      - name: Publish Friday reminder
        env:
          IG_GRAPH_API_VERSION: ${{ vars.IG_GRAPH_API_VERSION || secrets.IG_GRAPH_API_VERSION }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python instagram-lembrete-sexta/publicar_lembrete.py
