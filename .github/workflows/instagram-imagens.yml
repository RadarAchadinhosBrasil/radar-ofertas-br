name: Instagram — buscar imagens do lote
on:
  workflow_dispatch:
    inputs:
      slot:
        description: "Lote UTC a preparar"
        required: true
        type: choice
        options:
          - "0 12 * * *"
          - "0 15 * * *"
          - "0 18 * * *"
          - "0 21 * * *"
permissions:
  contents: write
jobs:
  imagens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Localizar e validar imagens dos anúncios
        run: python buscar_imagens_instagram.py "${{ inputs.slot }}"
      - name: Salvar imagens encontradas no catálogo
        if: always()
        run: |
          if ! git diff --quiet -- produtos.csv; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add produtos.csv
            git commit -m "Adiciona imagens verificadas aos produtos do lote"
            git push
          fi
